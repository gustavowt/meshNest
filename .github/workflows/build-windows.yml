name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  workflow_call:
    inputs:
      version_tag:
        required: true
        type: string

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version_tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Build Windows installer (no publish)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && inputs.version_tag == '' }}
        env:
          USE_HARD_LINKS: false
        run: npx electron-builder build --win --publish never

      - name: Build Windows installer (publish to GitHub)
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.version_tag != '' }}
        env:
          USE_HARD_LINKS: false
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npx electron-builder build --win --publish always

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: meshNest-Windows-Installer
          path: |
            release/*.exe
            release/*.exe.blockmap
          retention-days: 30
          if-no-files-found: error

      - name: Upload unpacked app artifact
        uses: actions/upload-artifact@v4
        with:
          name: meshNest-Windows-Unpacked
          path: release/win-unpacked
          retention-days: 7
          if-no-files-found: warn
