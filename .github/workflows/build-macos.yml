name: Build macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  workflow_call:
    inputs:
      version_tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version_tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      # Unsigned distribution DMG (no MAS target, no signing/provisioning).
      # The MAS target keeps local-only config in package.json — CI builds
      # an ad-hoc/universal DMG+zip for GitHub distribution instead.
      - name: Build macOS DMG (no publish)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && inputs.version_tag == '' }}
        env:
          USE_HARD_LINKS: false
        run: npx electron-builder build --mac dmg --publish never

      - name: Build macOS DMG (publish to GitHub)
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.version_tag != '' }}
        env:
          USE_HARD_LINKS: false
          GH_TOKEN: ${{ github.token }}
        run: npx electron-builder build --mac dmg --publish always

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: meshNest-macOS-DMG
          path: |
            release/*.dmg
            release/*.dmg.blockmap
            release/*.zip
          retention-days: 30
          if-no-files-found: error
