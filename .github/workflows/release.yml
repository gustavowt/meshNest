name: Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type (rebuild = re-release current version)'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - rebuild

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve version
        id: bump
        run: |
          CURRENT=$(node -p "require('./package.json').version")

          if [ "${{ inputs.bump_type }}" = "rebuild" ]; then
            NEW_VERSION="${CURRENT}"
            echo "Rebuilding current version ${NEW_VERSION}"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            case "${{ inputs.bump_type }}" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
            echo "Bumping ${CURRENT} → ${NEW_VERSION}"
            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('./package.json', 'utf8'));
              pkg.version = '${NEW_VERSION}';
              fs.writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n');
            "
          fi

          TAG="v${NEW_VERSION}"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        if: ${{ inputs.bump_type != 'rebuild' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "release: ${{ steps.bump.outputs.tag }}"
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin HEAD --tags

      - name: Delete existing release (rebuild)
        if: ${{ inputs.bump_type == 'rebuild' }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh release delete "${{ steps.bump.outputs.tag }}" --yes --cleanup-tag || true
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin "${{ steps.bump.outputs.tag }}" --force

  build-windows:
    needs: prepare
    uses: ./.github/workflows/build-windows.yml
    with:
      version_tag: ${{ needs.prepare.outputs.tag }}
    secrets: inherit

  build-linux:
    needs: prepare
    uses: ./.github/workflows/build-linux.yml
    with:
      version_tag: ${{ needs.prepare.outputs.tag }}
    secrets: inherit

  build-macos:
    needs: prepare
    uses: ./.github/workflows/build-macos.yml
    with:
      version_tag: ${{ needs.prepare.outputs.tag }}
    secrets: inherit
