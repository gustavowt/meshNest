name: Build Linux

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  workflow_call:
    inputs:
      version_tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version_tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Build Linux AppImage (no publish)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && inputs.version_tag == '' }}
        env:
          USE_HARD_LINKS: false
        run: npx electron-builder build --linux --publish never

      - name: Build Linux AppImage (publish to GitHub)
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.version_tag != '' }}
        env:
          USE_HARD_LINKS: false
          GH_TOKEN: ${{ github.token }}
        run: npx electron-builder build --linux --publish always

      - name: Upload Linux AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: meshNest-Linux-AppImage
          path: release/*.AppImage
          retention-days: 30
          if-no-files-found: error

      - name: Upload unpacked app artifact
        uses: actions/upload-artifact@v4
        with:
          name: meshNest-Linux-Unpacked
          path: release/linux-unpacked
          retention-days: 7
          if-no-files-found: warn
